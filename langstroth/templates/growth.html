{% extends "base_subnav.html" %}
{% load static %}

{% block content %}
<div class="container">
  <ul id="graph-buttons" class="nav nav-tabs">
    <li class="nav-item" id="alltime"><a class="nav-link" href="#">All</a></li>
    <li class="nav-item" id="5years"><a class="nav-link" href="#">5 years</a></li>
    <li class="nav-item" id="3years"><a class="nav-link" href="#">3 years</a></li>
    <li class="nav-item" id="1year"><a class="nav-link" href="#">12 months</a></li>
    <li class="nav-item" id="6months"><a class="nav-link active" href="#">6 months</a></li>
    <li class="nav-item" id="1month"><a class="nav-link" href="#">1 month</a></li>
  </ul>
  <div class="row my-4">
    <div class="col-12">
      <h4>Total Instances</h4>
      <div class="chart-container">
        <canvas class="chart" id="instance_count" data-url="/growth/instance_count/"></canvas>
      </div>
    </div>
  </div>
  <div class="row my-4">
    <div class="col-12">
      <h4>Used VCPUs</h4>
      <div class="chart-container">
        <canvas class="chart" id="vcpu_used" data-url="/growth/used_cores/"></canvas>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_script %}
<script src='{% static "js/chart.umd.min.js" %}'></script>
<script src='{% static "js/chartjs-adapter-date-fns.bundle.min.js" %}'></script>
<script src='{% static "js/chart_common.js" %}'></script>
<script src='{% static "js/growth.js" %}'></script>
{% endblock %}
